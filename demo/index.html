<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>codemirror-elements — languages &amp; themes</title>
    <style>
      :root {
        color-scheme: light dark;
        --bg: #ffffff;
        --fg: #1a1a1e;
        --muted: #5c5c68;
        --line: #dcdce4;
        --field: #f6f6f9;
      }

      @media (prefers-color-scheme: dark) {
        :root {
          --bg: #17171b;
          --fg: #ececf1;
          --muted: #9a9aa8;
          --line: #33333d;
          --field: #212128;
        }
      }

      * {
        box-sizing: border-box;
      }

      body {
        margin: 0;
        min-height: 100vh;
        display: flex;
        flex-direction: column;
        gap: 1.25rem;
        padding: 1.5rem clamp(1rem, 4vw, 3rem) 2rem;
        background: var(--bg);
        color: var(--fg);
        font-family:
          system-ui,
          -apple-system,
          'Segoe UI',
          sans-serif;
        line-height: 1.5;
      }

      /* Avoids a flash of the unstyled sample before the language loads. */
      body[loading] main {
        visibility: hidden;
      }

      header h1 {
        margin: 0;
        font-size: 1.35rem;
        letter-spacing: -0.01em;
      }

      header p {
        margin: 0.35rem 0 0;
        color: var(--muted);
        font-size: 0.9rem;
      }

      header a {
        color: inherit;
      }

      .controls {
        display: flex;
        flex-wrap: wrap;
        gap: 1rem 1.5rem;
        align-items: end;
      }

      .field {
        display: flex;
        flex-direction: column;
        gap: 0.3rem;
        min-width: 14rem;
      }

      .field label {
        font-size: 0.78rem;
        font-weight: 600;
        letter-spacing: 0.04em;
        text-transform: uppercase;
        color: var(--muted);
      }

      select {
        padding: 0.5rem 0.6rem;
        border: 1px solid var(--line);
        border-radius: 7px;
        background: var(--field);
        color: inherit;
        font: inherit;
      }

      main {
        flex: 1;
        display: flex;
        flex-direction: column;
        gap: 1rem;
        min-height: 0;
      }

      cm-editor {
        flex: 1;
        min-height: 24rem;
        border-radius: 8px;
        overflow: hidden;
        /* `<cm-editor>`'s own `.cm-editor { height: 100% }` doesn't resolve
           against a flex-sized host, which leaves an unthemed strip below a
           short document. As a grid container the editor stretches to fill. */
        display: grid;
      }

      details {
        border-top: 1px solid var(--line);
        padding-top: 0.75rem;
      }

      summary {
        cursor: pointer;
        font-size: 0.85rem;
        color: var(--muted);
      }

      pre {
        margin: 0.6rem 0 0;
        padding: 0.85rem 1rem;
        overflow-x: auto;
        border-radius: 7px;
        background: var(--field);
        font-size: 0.85rem;
      }
    </style>
    <script type="module" src="./demo.js"></script>
  </head>
  <body loading>
    <header>
      <h1>&lt;cm-editor&gt;</h1>
      <p>
        Every language and theme in
        <code>codemirror-elements</code>. Extensions are elements, so switching
        either one just swaps a child of the editor. See also the
        <a href="./basic.html">basic demo</a>.
      </p>
    </header>

    <div class="controls">
      <div class="field">
        <label for="language">Language</label>
        <select id="language"></select>
      </div>
      <div class="field">
        <label for="theme">Theme</label>
        <select id="theme">
          <option value="">None (CodeMirror default)</option>
        </select>
      </div>
    </div>

    <main>
      <cm-editor></cm-editor>

      <details open>
        <summary>Markup for this combination</summary>
        <pre id="markup"></pre>
      </details>
    </main>
  </body>
</html>
